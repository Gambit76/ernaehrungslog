<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ernährungslog</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ernährung">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Gleiche Bauweise wie die Trainingslog-App, Akzent Grün statt Blau. Phone-first, eine Spalte. */
:root{
  --bg:#eef0ec; --surface:#ffffff; --ink:#151a17; --muted:#5d6862; --line:#d4dad5;
  --accent:#17784a; --accent-ink:#ffffff; --accent-soft:#dff0e6;
  --amber:#8a6100; --amber-soft:#fbf0d0;
  --ok:#17784a; --ok-soft:#dff0e6; --warn:#a33a12; --warn-soft:#fbe5dc;
  --input:#f6f8f6; --band:#cfe6d8; --grid:#e3e8e4;
  --c-p:#17784a; --c-c:#b07800; --c-f:#7a4fb0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101412; --surface:#181e1b; --ink:#e5ebe7; --muted:#97a39c; --line:#2b3430;
  --accent:#5fd096; --accent-ink:#06150d; --accent-soft:#163225;
  --amber:#f0c75a; --amber-soft:#3a3016;
  --ok:#5fd096; --ok-soft:#163225; --warn:#ff9a72; --warn-soft:#3d2219;
  --input:#121714; --band:#1f3a2c; --grid:#252d29;
  --c-p:#5fd096; --c-c:#e0b04a; --c-f:#b48ae6; color-scheme:dark}}

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

header.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.title-row h1{font-size:clamp(24px,7.5vw,30px);line-height:1;text-transform:uppercase}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;width:100%}
.tabs button{flex:1;border:0;background:transparent;padding:6px 6px;border-radius:6px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.syncline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.syncline .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.syncline .dot.wait{background:var(--amber)} .syncline .dot.err{background:var(--warn)}
.syncline button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500}
.syncline button:disabled{opacity:.5}

.banner{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;display:grid;gap:8px}
.banner.err{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner button{justify-self:start;border:1px solid currentColor;background:transparent;border-radius:8px;padding:6px 12px;font-weight:500}

/* Tageskopf */
.daynav{display:flex;align-items:center;gap:6px;margin-top:14px}
.daynav button.arrow{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;min-height:40px;font-size:18px}
.daynav input[type=date]{flex:1;min-width:0;font:inherit;font-size:16px;font-family:var(--f-num);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px;-webkit-appearance:none;appearance:none}
.daynav .today{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:0 10px;font-size:13px;font-weight:500}
.dayopts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{white-space:nowrap;border:0;background:transparent;border-radius:6px;padding:6px 8px;font-size:13px;color:var(--muted);font-weight:500;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dayopts .phase{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dayopts .phase select{font-size:16px;font-weight:600;color:var(--ink);background:var(--input);border:1px solid var(--line);border-radius:8px;padding:6px 4px;min-height:38px}

/* Tagessumme */
.totals{position:sticky;top:var(--hdr,118px);z-index:4;background:var(--bg);padding:10px 0 8px;margin-top:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-bottom:1px solid var(--line)}
.meter{display:grid;gap:3px;min-width:0}
.meter .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter .v{font-family:var(--f-num);font-size:15px;white-space:nowrap}
.meter .v small{font-size:11px;color:var(--muted);margin-left:2px}
.meter .t{font-size:11px;color:var(--muted);white-space:nowrap}
.track{position:relative;height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.track .band{position:absolute;top:0;bottom:0;background:var(--band)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--muted)}
.track .fill.in{background:var(--ok)} .track .fill.over{background:var(--warn)} .track .fill.under{background:var(--amber)}

/* Mahlzeiten */
.meal{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meal-head h2{font-size:22px}
.meal-head .sum{font-size:12px;color:var(--muted);text-align:right}
.meal-head .sum b{font-family:var(--f-num);color:var(--ink);font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;margin-left:4px;vertical-align:1px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.low{background:var(--amber-soft);color:var(--amber)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:1px solid var(--line);background:var(--input);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap;min-height:36px}
.chipbtn.last{border-style:dashed;color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chipgrp{margin-bottom:8px}
.chipgrp .gl{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:2px 2px 5px}
.chipbtn.plus{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chipbtn:active{background:var(--accent-soft)}
.items{display:grid;gap:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-weight:500;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.item .mac{grid-column:1 / -1;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.qty{display:flex;align-items:center;gap:4px}
.qty input{width:64px;box-sizing:border-box;font-family:var(--f-num);font-size:16px;text-align:right;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px;-webkit-appearance:none;appearance:none}
.qty span{font-size:12px;color:var(--muted);width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;min-width:36px;min-height:38px;border-radius:8px}
.del:active{background:var(--warn-soft);color:var(--warn)}
.meal-actions{display:flex;gap:8px}
.meal-actions button{flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px;font-size:14px;font-weight:500;color:var(--accent);min-height:40px}
.note{margin-top:16px;display:grid;gap:6px}
.note label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note textarea{font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:60px;resize:vertical}

/* Dialog */
dialog{border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:640px;max-height:88vh;margin:auto auto 0;background:var(--surface);color:var(--ink);box-sizing:border-box}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:88vh}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:22px}
.dlg-head button{border:0;background:transparent;font-size:15px;color:var(--accent);font-weight:500;min-height:36px}
.dlg-body{overflow-y:auto;padding:12px 16px;display:grid;gap:12px;align-content:start}
.dlg-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.primary{flex:1;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px 18px;font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-height:48px}
.primary:disabled{opacity:.45}
.secondary{border:1px solid var(--line);background:transparent;border-radius:10px;padding:12px 14px;font-weight:500;min-height:48px}
.secondary.danger{color:var(--warn)}
.search{width:100%;box-sizing:border-box;font:inherit;font-size:16px;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;-webkit-appearance:none;appearance:none}
.flist{display:grid;gap:0}
.fcat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 0 4px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 0;min-height:48px;width:100%}
.frow .fn{font-weight:500;min-width:0}
.frow .fm{font-size:12px;color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.form input,.form select{font:inherit;font-size:16px;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;-webkit-appearance:none;appearance:none;box-sizing:border-box;width:100%}
.form .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.form .hint{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400}
.units{display:flex;gap:6px;flex-wrap:wrap}
.units button{border:1px solid var(--line);background:var(--input);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px}
.units button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.preview{font-family:var(--f-num);font-size:14px;background:var(--input);border-radius:10px;padding:10px 12px}
.wheelbox{position:relative;display:grid;place-items:center;height:200px}
.wheelband{position:absolute;left:0;right:0;top:80px;height:40px;background:var(--accent-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:8px;pointer-events:none}
.wheel{position:relative;z-index:1;width:100%;height:200px;box-sizing:border-box;padding:80px 0;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;outline:0;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,1) 30%,rgba(0,0,0,1) 70%,rgba(0,0,0,0));mask-image:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,1) 30%,rgba(0,0,0,1) 70%,rgba(0,0,0,0))}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:40px;line-height:40px;scroll-snap-align:center;text-align:center;font-family:var(--f-num);font-size:22px;color:var(--muted)}
.wheel div.sel{color:var(--ink);font-weight:500}
.wheelunit{position:absolute;z-index:2;left:calc(50% + 46px);top:80px;line-height:40px;font-size:15px;color:var(--ink);pointer-events:none;max-width:calc(50% - 50px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kbbtn{justify-self:center;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:500;min-height:36px;padding:0 12px}
.qtybtn{min-width:64px;box-sizing:border-box;font-family:var(--f-num);font-size:16px;text-align:right;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:38px}
.qtybtn:active{background:var(--accent-soft)}
.fnote{font-size:13px;color:var(--muted)}

/* Analyse */
.ana{display:grid;gap:14px;margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:clamp(24px,7vw,32px);font-weight:700;line-height:1.05;white-space:nowrap}
.tile .v small{font-size:.55em;margin-left:3px;color:var(--muted);font-weight:600}
.tile .d{font-size:12px;color:var(--muted)}
.tile .d.in{color:var(--ok)} .tile .d.over{color:var(--warn)} .tile .d.under{color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.panel h2{font-size:21px}
.panel .sub{font-size:12px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--grid)}
.split i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tips{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.range{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.range input[type=date]{font:inherit;font-size:15px;font-family:var(--f-num);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px;-webkit-appearance:none;appearance:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.empty{margin-top:20px;padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* Info */
.info{display:grid;gap:10px;margin-top:14px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.sec > summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px;font-weight:700}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"＋";font-family:var(--f-body);font-size:18px;color:var(--muted)}
details.sec[open] > summary::after{content:"－"}
.sec-body{padding:0 0 16px;display:grid;gap:12px;font-size:14px}
.sec-body h3{font-size:18px;margin-top:4px}
.sec-body p{margin:0}
.sec-body ol,.sec-body ul{margin:0;padding-left:20px;display:grid;gap:5px}
.callout{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.callout.warn{background:var(--amber-soft);color:var(--ink)}
.tblwrap{overflow-x:auto}
.footer{margin-top:22px;font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.linkbtn{border:0;background:transparent;color:var(--accent);padding:0;font-size:inherit;font-weight:500}

/* Setup */
.setup{max-width:520px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.setup h1{font-size:34px;text-transform:uppercase;line-height:1}
.setup p{margin:0;color:var(--muted)}
.setup label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:-8px}
.setup input{width:100%;box-sizing:border-box;font-family:var(--f-num);font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:46px;-webkit-appearance:none;appearance:none}
.setup .actions{display:flex;gap:16px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}

/* Einstellungen (App-Standard: Zahnrad oben rechts, gleicher Dialog in allen Apps) */
.title-row h1{flex:1}
.gear{flex:none;display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px}
.gear svg{width:20px;height:20px}
.setsec{display:grid;gap:10px}
.setsec + .setsec{border-top:1px solid var(--line);padding-top:14px}
.setsec h3{font-size:13px;font-family:var(--f-body);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.setinfo{margin:0;font-size:14px}
.setbtns{display:grid;gap:8px}
.setbtns .secondary{width:100%;text-align:center;color:var(--ink)}
.setnote{margin:0;font-size:13px;color:var(--muted)}
#setMsg .banner{margin-top:0}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
</style>
</head>
<body>

<section class="setup" id="setup" hidden>
  <h1>Ernährungslog</h1>
  <p>Verbinde die App einmalig mit deinem Google Sheet „Ernährungslog“. URL und Schlüssel bleiben nur auf diesem Gerät gespeichert.</p>

/* ---------- Helfer ---------- */
function todayISO(){ return msISO(Date.now()); }
function msISO(ms){ const d = new Date(ms); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isoMs(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d).getTime(); }
function addDays(iso, n){ const [y,m,d] = iso.split("-").map(Number); return msISO(new Date(y, m-1, d+n).getTime()); }
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
function wd(iso){ return WD[new Date(isoMs(iso)).getDay()]; }
function shortDE(iso){ const [,m,d] = iso.split("-"); return d+"."+m+"."; }
function longDE(iso){ const [y,m,d] = iso.split("-"); return wd(iso)+", "+d+"."+m+"."+y; }
function num(v){ if(v===null||v===undefined) return null; if(typeof v==="number") return isFinite(v)?v:null; const s=String(v).trim().replace(/\s/g,"").replace(",","."); if(s==="") return null; const n=Number(s); return isFinite(n)?n:null; }
function r0(v){ return Math.round(v || 0); }
function r1(v){ return Math.round((v || 0) * 10) / 10; }
function de(v, dec){ return (v || 0).toLocaleString("de-DE", {maximumFractionDigits: dec ?? 0}); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function timeDE(ts){ const d = new Date(ts); const t = d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); return msISO(ts) === todayISO() ? "heute " + t : shortDE(msISO(ts)) + " " + t; }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800); }

/* ---------- Lebensmittel ---------- */
function parseUnits(s){ // "Stück=75; Scheibe=35"
  if(Array.isArray(s)) return s;
  return String(s || "").split(/[;\n]/).map(x => x.split("=")).filter(x => x.length === 2 && num(x[1]) > 0).map(([n, g]) => [n.trim(), num(g)]);
}
function unitsToStr(u){ return (u || []).map(([n, g]) => n + "=" + String(g).replace(".", ",")).join("; "); }
function allFoods(){
  const map = {};
  DEFAULT_FOODS.forEach(f => map[f.id] = f);
  Object.values(customFoods).forEach(c => {
    const base = map[c.id];
    map[c.id] = Object.assign({}, base || {def: [100, c.per === "100 ml" ? "ml" : "g"]}, c, {units: parseUnits(c.units), cat: c.cat || (base && base.cat) || "Eigene", custom: true, overrides: !!base});
  });
  return map;
}
let FOODS = allFoods();
function baseUnit(f){ return f.per === "100 ml" ? "ml" : "g"; }
function unitGrams(f, unit){ if(!unit || unit === baseUnit(f)) return 1; const u = f.units.find(x => x[0] === unit); return u ? u[1] : null; }
function macrosFor(f, qty, unit){
  const g = unitGrams(f, unit); const amt = (qty || 0) * (g || 0) / 100;
  return {kcal: f.kcal * amt, p: f.p * amt, c: f.c * amt, f: f.f * amt};
}

/* ---------- Tage & Ziele ---------- */
function defaultType(iso){ const d = new Date(isoMs(iso)).getDay(); return d === 1 || d === 3 || d === 5 ? "train" : d === 6 ? "gravel" : "rest"; }
function inheritedPhase(iso){ // Phase des letzten davor gespeicherten Tages, sonst Standardphase
  let best = null;
  for(const k in days) if(k < iso && days[k].phase && (!best || k > best)) best = k;
  return best ? days[best].phase : defaultPhase;
}
function dayInfo(iso){ const d = days[iso] || {}; return {type: d.type || defaultType(iso), phase: d.phase || inheritedPhase(iso), note: d.note || "", stored: !!days[iso]}; }
function targetFor(iso){ const d = dayInfo(iso); return TARGETS[d.phase][d.type]; }
function dayEntries(iso){ return Object.values(entries).filter(e => e.date === iso).sort((a, b) => (a.ts || 0) - (b.ts || 0)); }
function sumOf(list){ return list.reduce((s, e) => ({kcal: s.kcal + (e.kcal||0), p: s.p + (e.p||0), c: s.c + (e.c||0), f: s.f + (e.f||0)}), {kcal: 0, p: 0, c: 0, f: 0}); }
function status(v, [lo, hi]){ return v < lo ? "under" : v > hi ? "over" : "in"; }

/* ======================================================================
   Schnittstelle & Sync
   ====================================================================== */
class ApiError extends Error { constructor(code, msg){ super(msg || code); this.code = code; } }
async function api(action, payload, conf){
  const c = conf || cfg;
  if(!c) throw new ApiError("no_config");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  try{
    let res;
    try{
      if(action === "load"){
        const sep = c.url.includes("?") ? "&" : "?";
        res = await fetch(c.url + sep + "action=load&key=" + encodeURIComponent(c.key) + "&t=" + Date.now(), {signal: ctrl.signal, cache: "no-store"});
      }else{
        // text/plain vermeidet die CORS-Vorabfrage, die Apps Script nicht beantwortet
        res = await fetch(c.url, {method: "POST", signal: ctrl.signal, headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({action, key: c.key}, payload || {}))});
      }
    }catch(e){ throw new ApiError(navigator.onLine === false ? "offline" : "network"); }
    let data;
    try{ data = await res.json(); }catch(e){ throw new ApiError("bad_response"); }
    if(!data || !data.ok) throw new ApiError((data && data.error) || "server", data && data.message);
    return data;
  }finally{ clearTimeout(timer); }
}
function isTransient(e){ return e && (e.code === "offline" || e.code === "network"); }
function errMsg(e){
  switch(e && e.code){
    case "offline": return "Du bist offline. Deine Einträge sind gespeichert und werden übertragen, sobald wieder Netz da ist.";
    case "network": return "Google ist gerade nicht erreichbar. Deine Einträge bleiben auf dem iPhone und werden später übertragen. Wenn das dauerhaft so ist: Steht die Bereitstellung im Apps Script auf „Zugriff: Jeder“?";
    case "unauthorized": return "Der Schlüssel passt nicht zum Apps Script. Oben auf das Zahnrad tippen, dann auf „Verbindung ändern“, und neu eintragen.";
    case "no_key": return "Im Apps Script fehlt noch der Schlüssel. Führe dort einmal die Funktion setupKey aus.";
    case "bad_response": return "Unter dieser URL antwortet kein Ernährungslog-Script. Es muss die Web-App-URL der Bereitstellung sein, die auf /exec endet.";
    case "bad_request": return "Das Sheet hat eine Änderung abgelehnt: " + (e.message || "ungültige Daten") + ".";
    default: return "Fehler im Apps Script: " + ((e && e.message) || "unbekannt") + ".";
  }
}

// Änderungen lokal anwenden und für das Sheet vormerken
function queue(op){
  applyOp(op);
  // gleiche ID / gleiches Datum: ältere Operation ersetzen
  const key = o => o.t === "put" ? "e:" + o.e.id : o.t === "del" ? "e:" + o.id : o.t === "day" ? "d:" + o.date : "f:" + (o.f ? o.f.id : o.id);
  const k = key(op);
  outbox = outbox.filter(o => key(o) !== k);
  outbox.push(op);
  LS.set("outbox", outbox);
  persist();
  renderSync();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, 1500);
}
function applyOp(op){
  if(op.t === "put") entries[op.e.id] = op.e;
  else if(op.t === "del") delete entries[op.id];
  else if(op.t === "day") days[op.date] = {type: op.type, phase: op.phase, note: op.note};
  else if(op.t === "food"){ customFoods[op.f.id] = op.f; FOODS = allFoods(); }
  else if(op.t === "fooddel"){ delete customFoods[op.id]; FOODS = allFoods(); }
}
function persist(){ LS.set("data", {entries, days, foods: customFoods}); }
function legacyFix(e){ if(e && (e.fid === "milch18" || e.fid === "milch15")){ e.fid = "milch15"; e.name = "Milch (Halbfett)"; } return e; }
function ingest(data){
  entries = {}; days = {}; customFoods = {};
  (data.entries || []).forEach(e => { e.ts = e.ts || 0; entries[e.id] = legacyFix(e); });
  (data.days || []).forEach(d => days[d.date] = {type: d.type, phase: d.phase, note: d.note});
  (data.foods || []).forEach(f => customFoods[f.id] = f);
  outbox.forEach(applyOp);
  FOODS = allFoods();
}
function loadCache(){
  const c = LS.get("data", null);
  if(!c) return;
  entries = c.entries || {}; Object.values(entries).forEach(legacyFix); days = c.days || {}; customFoods = c.foods || {}; delete customFoods.milch18;
  FOODS = allFoods();
}
async function flush(){
  if(!outbox.length) return;
  const batch = outbox.slice();
  try{ await api("apply", {ops: batch}); }
  catch(e){
    if(e.code === "bad_request"){ outbox = outbox.filter(o => !batch.includes(o)); LS.set("outbox", outbox); showBanner("err", errMsg(e)); return; }
    throw e;
  }
  outbox = outbox.filter(o => !batch.includes(o));
  LS.set("outbox", outbox);
}
async function sync(){
  if(syncing || !cfg) return;
  syncing = true; renderSync();
  try{
    await flush();
    const data = await api("load");
    // Während des Ladens neu vorgemerkte Änderungen bleiben erhalten
    const order = Object.fromEntries(Object.values(entries).map(e => [e.id, e.ts]));
    ingest(data);
    Object.values(entries).forEach(e => { if(order[e.id]) e.ts = order[e.id]; });
    persist();
    lastSync = Date.now(); LS.set("lastSync", lastSync);
    syncError = null;
    if($("banner").dataset.kind === "err") clearBanner();
    const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches("input,textarea");
    if(!typing) render();
  }catch(e){
    syncError = e;
    if(!isTransient(e)) showBanner("err", errMsg(e), "Erneut versuchen", sync);
  }finally{
    syncing = false; renderSync();
    if(outbox.length && !syncError){ clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
  }
}

function renderSync(){

  else if(n){ dot = syncError ? "err" : "wait"; txt = n === 1 ? "1 Änderung wartet" : n + " Änderungen warten"; if(syncError && isTransient(syncError)) txt += " (offline)"; }

function setTab(t){

function meterHTML(label, v, rng, unit){
  const max = Math.max(rng[1] * 1.15, v);
  const st = status(v, rng);
  return `<div class="meter">
    <span class="k">${label}</span>
    <span class="v">${de(v)}<small>${unit}</small></span>
    <div class="track"><span class="band" style="left:${rng[0]/max*100}%;width:${(rng[1]-rng[0])/max*100}%"></span><span class="fill ${v ? st : ""}" style="width:${Math.min(100, v/max*100)}%"></span></div>
    <span class="t">${de(rng[0])}–${de(rng[1])}</span>
  </div>`;
}
function prevDayWith(meal){
  const d = addDays(curDate, -1);
  return Object.values(entries).some(e => e.meal === meal && e.date === d) ? d : null;
}
function renderEntry(){
  const di = dayInfo(curDate);
  const tg = TARGETS[di.phase][di.type];
  const list = dayEntries(curDate);
  const tot = sumOf(list);
  let h = `<div class="daynav">

    </div>

      <label class="phase" title="Phase"><select id="dPhase" aria-label="Phase für diesen Tag">${PHASES.map(([k, l]) => `<option value="${k}"${k === di.phase ? " selected" : ""}>${PHASE_SHORT[k]}</option>`).join("")}</select></label>
    </div>
    <div class="totals">
      ${meterHTML("kcal", tot.kcal, tg.kcal, "")}
      ${meterHTML("Protein", tot.p, tg.p, "g")}
      ${meterHTML("KH", tot.c, tg.c, "g")}
      ${meterHTML("Fett", tot.f, tg.f, "g")}
    </div>`;
  for(const [mk, mn] of MEALS){
    const items = list.filter(e => e.meal === mk);
    const s = sumOf(items);
    const main = mk !== "snack";
    const badge = main && items.length ? `<span class="badge ${s.p >= PROTEIN_MEAL_MIN ? "ok" : "low"}">${s.p >= PROTEIN_MEAL_MIN ? "✓ ≥40 g" : "< 40 g"}</span>` : "";
    const lastD = prevDayWith(mk);
    h += `<section class="meal" data-meal="${mk}">
      <div class="meal-head"><h2>${mn}</h2><div class="sum">${items.length ? `<b>${de(s.p)} g</b> Protein · <b>${de(s.kcal)}</b> kcal${badge}` : "noch leer"}</div></div>
      ${GROUPS[mk].map(([gk, gl]) => {
        const ps = PRESETS.filter(p => p.meal === mk && p.grp === gk);
        const copy = gk === GROUPS[mk][0][0] && lastD ? `<button class="chipbtn last" type="button" data-copy="${mk}" data-from="${lastD}">Wie Vortag</button>` : "";
        if(!ps.length && !copy) return "";
        return `<div class="chipgrp">${gl ? `<span class="gl">${esc(gl)}</span>` : ""}<div class="chips wrap">${ps.map(p => `<button class="chipbtn${p.merge && p.label.startsWith("+") ? " plus" : ""}" type="button" data-preset="${p.id}">${esc(p.label)}</button>`).join("")}${copy}</div></div>`;
      }).join("")}
      ${items.length ? `<div class="items">${items.map(itemHTML).join("")}</div>` : ""}
      <div class="meal-actions">
        <button type="button" data-add="${mk}">+ Lebensmittel</button>
        <button type="button" data-free="${mk}">+ Freie Eingabe</button>

  }

}
function itemHTML(e){
  const f = e.fid && FOODS[e.fid];
  return `<div class="item" data-id="${esc(e.id)}">
    <span class="nm">${esc(e.name)}</span>
    <span class="qty"><button type="button" class="qtybtn" data-qtyopen="${esc(e.id)}" aria-label="Menge ändern: ${esc(e.name)}">${esc(fmtQ(e.qty))}</button><span>${esc(e.unit || "")}</span></span>
    <button class="del" type="button" data-del="${esc(e.id)}" aria-label="${esc(e.name)} löschen">×</button>
    <span class="mac">P ${de(e.p, 1)} · KH ${de(e.c, 1)} · F ${de(e.f, 1)} · ${de(e.kcal)} kcal${f ? "" : e.src === "frei" ? " · frei" : ""}</span>
  </div>`;

function makeEntry(meal, fid, qty, unit, src){
  const f = FOODS[fid]; if(!f) return null;
  const m = macrosFor(f, qty, unit);
  return {id: newId(), date: curDate, meal, name: f.name, qty, unit, kcal: r0(m.kcal), p: r1(m.p), c: r1(m.c), f: r1(m.f), src, fid, ts: Date.now()};
}
function ensureDayStored(){
  // Tagestyp und Phase gehören zu jedem Tag mit Einträgen ins Sheet
  if(!days[curDate]){ const d = dayInfo(curDate); queue({t: "day", date: curDate, type: d.type, phase: d.phase, note: d.note}); }
}
function addPreset(pid){
  const p = PRESETS.find(x => x.id === pid); if(!p) return;
  const di = dayInfo(curDate);
  let n = 0;
  p.items.forEach(([fid, q, u]) => {
    const qty = q === "rice" ? RICE[di.phase][di.type] : q;
    if(!qty) return;
    if(p.merge || MERGE_FIDS.has(fid)){
      // Baustein ist schon da: Menge erhöhen statt doppelte Zeile
      const ex = dayEntries(curDate).find(e => e.meal === p.meal && e.fid === fid && e.unit === u);
      if(ex){ changeQty(ex.id, String(r1(ex.qty + qty))); return; }
    }
    const e = makeEntry(p.meal, fid, qty, u, "Vorlage"); if(!e) return;
    e.ts = Date.now() + n++;
    queue({t: "put", e});
  });
  ensureDayStored();
  renderEntry();
  toast(p.label.replace(/^\+ /, "") + " eingetragen");
}
function copyMeal(meal, from){
  let n = 0;

function macrosForEntry(e, q){

  if(f && unitGrams(f, e.unit)) return macrosFor(f, q, e.unit);

}

/* ---------- Mengen-Walze (iOS-Stil) ---------- */
const WHEEL_ROW = 40;
function fmtQ(v){ return String(Math.round((v || 0) * 100) / 100).replace(".", ","); }
function wheelValues(unit, cur){
  const u = String(unit || ""), vals = [];
  if(u === "g"){ for(let v = 5; v <= 100; v += 5) vals.push(v); for(let v = 110; v <= 1000; v += 10) vals.push(v); }
  else if(u === "ml"){ for(let v = 10; v <= 1500; v += 10) vals.push(v); }
  else {
    const step = /^Gr\./.test(u) || u === "Ei" ? 1 : /Flasche/.test(u) ? 0.25 : 0.5;
    const max = /Flasche/.test(u) ? 3 : 10;
    for(let i = 1; i * step <= max + 1e-9; i++) vals.push(Math.round(i * step * 100) / 100);
  }
  // Aktueller Wert, der nicht im Raster liegt (z. B. 37 g), bleibt erhalten
  if(cur > 0 && !vals.some(v => Math.abs(v - cur) < 1e-6)){ vals.push(cur); vals.sort((a, b) => a - b); }
  return vals;
}
function buildWheel(host, unit, cur, onChange){
  const vals = wheelValues(unit, cur);
  host.innerHTML = `<div class="wheelband"></div><div class="wheel" tabindex="0" role="spinbutton" aria-label="Menge">${vals.map(v => `<div>${esc(fmtQ(v))}</div>`).join("")}</div><span class="wheelunit">${esc(unit || "")}</span>`;
  const w = host.querySelector(".wheel"), rows = w.children;
  let idx = -1;
  const mark = i => { if(i === idx) return; if(rows[idx]) rows[idx].classList.remove("sel"); idx = i; rows[i].classList.add("sel"); };
  let start = 0, best = Infinity;
  vals.forEach((v, i) => { const d = Math.abs(v - (cur || 0)); if(d < best){ best = d; start = i; } });
  mark(start);
  w.scrollTop = start * WHEEL_ROW;
  w.addEventListener("scroll", () => {
    const i = Math.max(0, Math.min(vals.length - 1, Math.round(w.scrollTop / WHEEL_ROW)));
    if(i === idx) return;
    mark(i); onChange(vals[i]);
  }, {passive: true});
}
function qtyPicker(p, unit, start, onChange){
  const host = $(p + "Wheel"), row = $(p + "KbRow"), inp = $(p + "Qty"), kb = $(p + "Kb");
  let kbMode = false;
  const fire = () => onChange(num(inp.value) || 0);
  const draw = () => buildWheel(host, unit, num(inp.value) || start, v => { inp.value = fmtQ(v); fire(); });
  inp.value = fmtQ(start);
  draw();
  inp.oninput = fire;
  kb.onclick = () => {
    kbMode = !kbMode;

    row.style.display = kbMode ? "" : "none";
    kb.textContent = kbMode ? "Walze" : "Zahl eintippen";
    if(kbMode){ inp.focus(); inp.select(); } else draw();
  };
  return {unit(u, v){ unit = u; inp.value = fmtQ(v); if(!kbMode) draw(); fire(); }};
}

function tileHTML(label, v, rng, unit){
  const st = v ? status(v, rng) : "";
  const diff = v < rng[0] ? `${de(rng[0] - v)} ${unit} unter Ziel` : v > rng[1] ? `${de(v - rng[1])} ${unit} über Ziel` : "im Ziel";
  return `<div class="tile"><span class="k">${label}</span><span class="v">${de(v)}<small>${unit}</small></span><span class="d ${st}">Ziel ${de(rng[0])}–${de(rng[1])} · ${v ? diff : "–"}</span></div>`;
}
function renderAna(){
  let h = `<div class="ana"><div class="seg" role="group" aria-label="Ansicht" style="justify-self:start">
      <button type="button" data-ana="day" aria-pressed="${anaMode === "day"}">Tag</button>

function anaDay(){
  const di = dayInfo(curDate);
  const tg = TARGETS[di.phase][di.type];
  const list = dayEntries(curDate);
  const t = sumOf(list);
  let h = `<div class="daynav" style="margin-top:0">
      <button class="arrow" type="button" data-nav="-1" aria-label="Vortag">‹</button>
      <input type="date" id="aDate" value="${curDate}">
      <button class="arrow" type="button" data-nav="1" aria-label="Folgetag">›</button>
    </div>
    <p class="sub" style="margin:0;font-size:13px;color:var(--muted)">${longDE(curDate)} · ${TYPE_LONG[di.type]} · ${PHASE_NAME[di.phase]}</p>`;
  if(!list.length) return h + `<div class="empty">Für diesen Tag gibt es noch keine Einträge.</div>`;
  h += `<div class="tiles">${tileHTML("Kalorien", t.kcal, tg.kcal, "kcal")}${tileHTML("Protein", t.p, tg.p, "g")}${tileHTML("Kohlenhydrate", t.c, tg.c, "g")}${tileHTML("Fett", t.f, tg.f, "g")}</div>`;

  // Energieverteilung
  const eP = t.p * 4, eC = t.c * 4, eF = t.f * 9, eS = eP + eC + eF || 1;
  h += `<div class="panel"><h2>Energie aus Makros</h2>
    <div class="split"><i style="width:${eP/eS*100}%;background:var(--c-p)"></i><i style="width:${eC/eS*100}%;background:var(--c-c)"></i><i style="width:${eF/eS*100}%;background:var(--c-f)"></i></div>
    <div class="legend"><span><i style="background:var(--c-p)"></i>Protein ${de(eP/eS*100)} %</span><span><i style="background:var(--c-c)"></i>KH ${de(eC/eS*100)} %</span><span><i style="background:var(--c-f)"></i>Fett ${de(eF/eS*100)} %</span></div>
    <p class="sub">Protein ${de(t.p / 87, 1)} g/kg bei ca. 87 kg.</p></div>`;

  // Mahlzeiten
  h += `<div class="panel"><h2>Mahlzeiten</h2><table class="tbl"><thead><tr><th>Mahlzeit</th><th class="n">Protein</th><th class="n">KH</th><th class="n">Fett</th><th class="n">kcal</th></tr></thead><tbody>`;
  for(const [mk, mn] of MEALS){
    const s = sumOf(list.filter(e => e.meal === mk));
    if(!s.kcal && !s.p) continue;
    const flag = mk !== "snack" ? (s.p >= PROTEIN_MEAL_MIN ? ` <span class="badge ok">✓</span>` : ` <span class="badge low">&lt;40</span>`) : "";
    h += `<tr><td>${mn}${flag}</td><td class="n">${de(s.p)} g</td><td class="n">${de(s.c)} g</td><td class="n">${de(s.f)} g</td><td class="n">${de(s.kcal)}</td></tr>`;
  }
  h += `</tbody></table><p class="sub">Hauptmahlzeiten: Ziel ≥ ${PROTEIN_MEAL_MIN} g Protein (anabole Schwelle), besser 55–60 g.</p></div>`;

  // Hinweise
  const tips = dayTips(t, tg, di, list);
  if(tips.length) h += `<div class="panel"><h2>Was heute noch hilft</h2><ul class="tips">${tips.map(x => `<li>${x}</li>`).join("")}</ul></div>`;

  // Lebensmittel mit dem meisten Protein
  const top = list.slice().sort((a, b) => b.p - a.p).slice(0, 5);
  h += `<div class="panel"><h2>Top-Proteinquellen</h2><table class="tbl"><tbody>${top.map(e => `<tr><td>${esc(e.name)}</td><td class="n">${de(e.p, 1)} g</td></tr>`).join("")}</tbody></table></div>`;
  return h;
}
function dayTips(t, tg, di, list){
  const out = [];
  const pGap = tg.p[0] - t.p;
  if(pGap > 3){
    const quark = Math.ceil(pGap / 13 * 10) * 10;
    out.push(`<b>Protein:</b> noch ${de(pGap)} g bis zum Ziel – z. B. ${quark} g Magerquark (+${de(quark * 0.13)} g) oder ein Whey-Shake mit Milch (+${de(0.3 * 75 + 3 * 3.4)} g).`);
  }else if(t.p > tg.p[1] + 15){
    out.push(`<b>Protein:</b> ${de(t.p - tg.p[1])} g über dem Ziel. Unschädlich, aber Kalorien lieber über Kohlenhydrate holen.`);
  }
  const kGap = tg.kcal[0] - t.kcal;
  if(kGap > 150){
    if(di.phase === "bulk"){
      const rice = Math.round(kGap / 3.5 / 10) * 10;
      out.push(`<b>Kalorien:</b> noch ${de(kGap)} kcal bis zum Lean-Bulk-Ziel – z. B. ca. ${rice} g Reis (roh) extra, Haferflocken oder eine Banane plus 30 g Nüsse.`);
    }else out.push(`<b>Kalorien:</b> noch ${de(kGap)} kcal Spielraum.`);
  }else if(t.kcal > tg.kcal[1] + 150){
    out.push(`<b>Kalorien:</b> ${de(t.kcal - tg.kcal[1])} kcal über dem Ziel. Kein Drama – im Wochenschnitt zählt es.`);
  }
  if(t.f > tg.f[1] + 10) out.push(`<b>Fett:</b> ${de(t.f - tg.f[1])} g über Ziel. Häufige Ursachen: Öl beim Braten, Nüsse, Butter, Lachs.`);
  if((di.type === "train" || di.type === "gravel") && t.c < tg.c[0] - 40) out.push(`<b>Kohlenhydrate:</b> An Trainingstagen gezielt um das Training herum (Banane vorher, Reis abends) – das füllt Glykogen und senkt Cortisol.`);
  if(list.some(e => e.fid === "weisswein" || e.fid === "grauburgunder" || e.fid === "bier")) out.push(`<b>Alkohol:</b> drückt die Proteinsynthese um bis zu 37 % und stört den Tiefschlaf. Viel Wasser dazu, morgen auf die Waage nicht zu viel geben (Wasser).`);
  return out;
}

      <td class="n" style="color:var(--${r.s.p >= r.tg.p[0] ? "ok" : "amber"})">${de(r.s.p)}</td><td class="n">${de(r.s.c)}</td><td class="n">${de(r.s.f)}</td></tr>`).join("")}
    </tbody></table></div><p class="sub">Tippen öffnet den Tag in der Tagesansicht.</p></div>`;
  return h;
}
function barChart(rows, val, rng, overOk){
  const W = 600, H = 190, L = 40, B = 22, Tp = 8;
  const n = rows.length;
  const maxV = Math.max(...rows.map(r => Math.max(val(r), rng(r)[1]))) * 1.08 || 1;
  const y = v => Tp + (H - Tp - B) * (1 - v / maxV);
  const bw = (W - L) / n;
  const ticks = niceTicks(maxV);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm">`;
  ticks.forEach(t => { s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t >= 1000 ? de(t / 1000, 1) + "k" : de(t)}</text>`; });
  const every = Math.ceil(n / 10);
  rows.forEach((r, i) => {
    const x = L + i * bw, v = val(r), [lo, hi] = rng(r);
    s += `<rect x="${x + bw * 0.08}" width="${bw * 0.84}" y="${y(hi)}" height="${Math.max(1, y(lo) - y(hi))}" fill="var(--band)" rx="2"/>`;
    if(r.n){
      let st = status(v, [lo, hi]); if(overOk && st === "over") st = "in";
      s += `<rect x="${x + bw * 0.22}" width="${bw * 0.56}" y="${y(v)}" height="${Math.max(0, y(0) - y(v))}" fill="var(--${{in:"ok",under:"amber",over:"warn"}[st]})" rx="2"><title>${shortDE(r.d)}: ${de(v)}</title></rect>`;
    }
    if(i % every === 0 || i === n - 1) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${shortDE(r.d).slice(0, 5)}</text>`;
  });
  s += `<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg>`;
  return s;
}
function niceTicks(max){
  const raw = max / 4, pow = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(m => m * pow).find(s => s >= raw);
  const out = []; for(let v = 0; v <= max; v += step) out.push(v); return out;
}

async function clearCacheAndReload(){
  if(navigator.onLine === false){ setMsg("err", "Du bist offline. Aktualisieren geht nur mit Netz, sonst wäre die App danach nicht mehr ladbar."); return; }
  $("setReload").disabled = true; setMsg("info", "Leere den Cache und lade neu …");
  try{
    if("caches" in window){ const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    if("serviceWorker" in navigator){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
  }catch(e){}
  location.reload();
}

  $("openSettings").onclick = openSettings;
  $("setClose").onclick = () => $("settings").close();
  $("settings").addEventListener("click", ev => { if(ev.target === $("settings")) $("settings").close(); });
  $("setTest").onclick = testConnection;
  $("setChange").onclick = () => { $("settings").close(); showSetup(); };
  $("setReload").onclick = clearCacheAndReload;
}

/* ---------- Einrichtung ---------- */
function showSetup(){
  $("app").hidden = true; $("setup").hidden = false;
  $("cfgUrl").value = cfg ? cfg.url : ""; $("cfgKey").value = cfg ? cfg.key : "";
  $("cfgCancel").hidden = !cfg; $("cfgMsg").innerHTML = "";
}
async function saveCfg(){
  const url = $("cfgUrl").value.trim(), key = $("cfgKey").value.trim();
  const msg = (kind, text) => $("cfgMsg").innerHTML = `<div class="banner ${kind}"><div>${esc(text)}</div></div>`;
  if(!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/?#]+\/exec\/?$/.test(url)){ msg("err", "Die URL muss mit https://script.google.com/macros/s/ beginnen und auf /exec enden."); return; }
  if(key.length < 16){ msg("err", "Bitte den Schlüssel aus setupKey() einfügen."); return; }
  const next = {url: url.replace(/\/$/, ""), key};
  $("cfgSave").disabled = true; msg("info", "Teste die Verbindung …");
  try{
    const data = await api("load", null, next);
    cfg = next; LS.set("cfg", cfg);
    ingest(data); persist();
    lastSync = Date.now(); LS.set("lastSync", lastSync); syncError = null;
    $("setup").hidden = true; $("app").hidden = false;
    clearBanner(); render(); renderSync();
    if(outbox.length) sync();
  }catch(e){ msg("err", errMsg(e)); }
  finally{ $("cfgSave").disabled = false; }
}

/* ---------- Start ---------- */
function boot(){
  LS.set("lastDate", todayISO());
  loadCache();
  outbox.forEach(applyOp);
  if(!cfg){ showSetup(); return; }
  $("app").hidden = false;
  render(); renderSync();
  sync();
}
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
